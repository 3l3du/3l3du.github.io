<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@core:~# eledu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal" id="terminal"></div>

    <script>
        const terminal = document.getElementById('terminal');

        // Obtener IP pública de forma segura con un respaldo garantizado
        async function getVisitorIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return '190.221.45.12'; // IP simulada de respaldo si la red bloquea la petición
            }
        }

        // Formato de fecha y hora estilo Linux
        function getLinuxTimestamp() {
            const now = new Date();
            const options = { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                year: 'numeric',
                hour12: false 
            };
            return now.toLocaleString('en-US', options).replace(/,/g, '');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function typeText(element, text, speed = 40) {
            for (let i = 0; i < text.length; i++) {
                element.textContent += text[i];
                await sleep(speed + Math.random() * 15);
            }
        }

        async function runTerminal() {
            // Obtenemos los datos en paralelo o con respaldo rápido
            const visitorIP = await getVisitorIP();
            const timestamp = getLinuxTimestamp();

            const sequence = [
                { type: 'command', prompt: '<span class="host-dim">guest@local</span>:<span class="path">~</span><span class="prompt">$</span> ', text: 'ssh eledu@core', delay: 300 },
                { type: 'password', prompt: '<span class="auth-prompt">eledu@core\'s password: </span>', text: '********', delay: 350 },
                { type: 'system', text: `Last login: ${timestamp} from ${visitorIP}`, delay: 250 },
                { type: 'command', prompt: '<span class="normal-user">eledu@core</span>:<span class="path">~</span><span class="prompt">$</span> ', text: 'sudo su', delay: 400 },
                { type: 'prompt-final', prompt: '<span class="root-user">root@core</span>:<span class="path">~</span><span class="prompt">#</span> ', delay: 200 }
            ];

            await sleep(200);

            for (const step of sequence) {
                const line = document.createElement('div');
                line.className = 'line';
                terminal.appendChild(line);

                if (step.type === 'command' || step.type === 'password') {
                    line.innerHTML = step.prompt;
                    const span = document.createElement('span');
                    span.className = step.type === 'command' ? 'command' : 'auth-prompt';
                    const cursor = document.createElement('span');
                    cursor.className = 'cursor';
                    cursor.textContent = '_';

                    line.appendChild(span);
                    line.appendChild(cursor);

                    await typeText(span, step.text, step.type === 'password' ? 45 : 35);
                    await sleep(step.delay);
                    cursor.remove();
                } else if (step.type === 'system') {
                    line.className = 'line system-info';
                    line.textContent = step.text;
                    await sleep(step.delay);
                } else if (step.type === 'prompt-final') {
                    line.innerHTML = step.prompt + '<span class="cursor">_</span>';
                }
            }
        }

        runTerminal();
    </script>
</body>
</html>
