<body>
    <div class="terminal" id="terminal"></div>

    <script>
        const terminal = document.getElementById('terminal');

        // Función para obtener la IP real del visitante
        async function getVisitorIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return '192.168.1.50'; // IP de respaldo si falla la red
            }
        }

        // Función para formatear la fecha y hora al estilo Linux (ej: Fri Nov 13 10:58:00 2026)
        function getLinuxTimestamp() {
            const now = new Date();
            const options = { 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit', 
                year: 'numeric',
                hour12: false 
            };
            // Retorna un string formateado similar al comando 'date' de Linux
            return now.toLocaleString('en-US', options).replace(/,/g, '');
        }

            ];
