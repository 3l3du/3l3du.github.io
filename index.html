<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@core:~# eledu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal" id="terminal"></div>

    <script>
        const terminal = document.getElementById('terminal');

        const sequence = [
            { type: 'command', prompt: '<span class="host-dim">guest@local</span>:<span class="path">~</span><span class="prompt">$</span> ', text: 'ssh eledu@core', delay: 400 },
            { type: 'password', prompt: '<span class="auth-prompt">eledu@core\'s password: </span>', text: '********', delay: 500 },
            { type: 'command', prompt: '<span class="root-user">root@core</span>:<span class="path">~</span><span class="prompt">$</span> ', text: 'sudo su', delay: 600 },
            { type: 'prompt-final', prompt: '<span class="root-user">root@core</span>:<span class="path">~</span><span class="prompt">#</span> ', delay: 300 }
        ];

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function typeText(element, text, speed = 50) {
            for (let i = 0; i < text.length; i++) {
                element.textContent += text[i];
                await sleep(speed + Math.random() * 25);
            }
        }

        async function runTerminal() {
            await sleep(300);

            for (const step of sequence) {
                const line = document.createElement('div');
                line.className = 'line';
                terminal.appendChild(line);

                if (step.type === 'command' || step.type === 'password') {
                    line.innerHTML = step.prompt;
                    const span = document.createElement('span');
                    span.className = step.type === 'command' ? 'command' : 'auth-prompt';
                    const cursor = document.createElement('span');
                    cursor.className = 'cursor';
                    cursor.textContent = '_';

                    line.appendChild(span);
                    line.appendChild(cursor);

                    await typeText(span, step.text, step.type === 'password' ? 60 : 45);
                    await sleep(step.delay);
                    cursor.remove();
                } else if (step.type === 'prompt-final') {
                    line.innerHTML = step.prompt + '<span class="cursor">_</span>';
                }
            }
        }

        runTerminal();
    </script>
</body>
</html>
